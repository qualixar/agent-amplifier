[tox]
envlist = py311,py312,py313,py314
isolated_build = true
skip_missing_interpreters = true

[testenv]
description = Run agent-amplifier test suite under {basepython}
package = wheel
wheel_build_env = .pkg
deps =
    pytest
    pytest-cov
    pytest-randomly
    pytest-subprocess
    hypothesis
    anyio
    rich
commands =
    pytest tests/ --cov=agent_amplifier --cov-report=term -q

[testenv:py311]
basepython = /Users/v.pratap.bhardwaj/.local/share/uv/python/cpython-3.11.15-macos-aarch64-none/bin/python3.11

[testenv:py312]
basepython = /Users/v.pratap.bhardwaj/.local/share/uv/python/cpython-3.12-macos-aarch64-none/bin/python3.12

[testenv:py313]
basepython = python3.13

[testenv:py314]
basepython = python3.14

name: sbom

# Stage 10 CODEX-036: generate a CycloneDX SBOM on every release tag so
# downstream consumers (and Stage 14 launch-day audit) have an explicit
# bill of materials for each shipped wheel.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: actions/setup-python@0a5c61591373683505ea898e09a3ea4f39ef2b9c  # v5.0.0
        with:
          python-version: "3.13"
      - name: Install build + cyclonedx
        run: |
          python -m pip install --upgrade pip build cyclonedx-bom
      - name: Build wheel + sdist
        run: python -m build
      - name: Generate CycloneDX SBOM
        run: |
          python -m pip install -e .
          cyclonedx-py environment -o sbom.cdx.json --schema-version 1.5
      - name: Upload SBOM
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808  # v4.3.3
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json
          retention-days: 90
